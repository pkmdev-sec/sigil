<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background: PITCH BLACK -->
  <rect width="800" height="500" fill="#000000"/>

  <!-- Title -->
  <text x="400" y="35" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Cost per 1000 API Calls</text>
  <text x="400" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Standard vs Cached Pricing (Approximate)</text>

  <!-- Y-axis -->
  <line x1="100" y1="80" x2="100" y2="380" stroke="#8b949e" stroke-width="1" opacity="0.3"/>

  <!-- Y-axis labels and grid lines -->
  <text x="90" y="384" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="end">$0</text>
  <line x1="100" y1="380" x2="720" y2="380" stroke="#8b949e" stroke-width="0.5" opacity="0.15"/>

  <text x="90" y="324" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="end">$3</text>
  <line x1="100" y1="320" x2="720" y2="320" stroke="#8b949e" stroke-width="0.5" opacity="0.15"/>

  <text x="90" y="264" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="end">$6</text>
  <line x1="100" y1="260" x2="720" y2="260" stroke="#8b949e" stroke-width="0.5" opacity="0.15"/>

  <text x="90" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="end">$9</text>
  <line x1="100" y1="200" x2="720" y2="200" stroke="#8b949e" stroke-width="0.5" opacity="0.15"/>

  <text x="90" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="end">$12</text>
  <line x1="100" y1="140" x2="720" y2="140" stroke="#8b949e" stroke-width="0.5" opacity="0.15"/>

  <text x="90" y="84" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="end">$15</text>
  <line x1="100" y1="80" x2="720" y2="80" stroke="#8b949e" stroke-width="0.5" opacity="0.15"/>

  <!-- X-axis -->
  <line x1="100" y1="380" x2="720" y2="380" stroke="#8b949e" stroke-width="1" opacity="0.3"/>

  <!-- ===== OPUS GROUP (center x=220) ===== -->
  <!-- Opus Standard: $15 → bar height = 300px (full), bottom at y=380 -->
  <!-- Input portion: $10 (200px) + Output: $5 (100px) -->
  <rect x="170" y="80" width="50" height="200" rx="0" fill="#f85149" fill-opacity="0.6"/>
  <rect x="170" y="280" width="50" height="100" rx="0" fill="#f85149" fill-opacity="0.3"/>
  <text x="195" y="190" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Input</text>
  <text x="195" y="340" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Output</text>
  <text x="195" y="73" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#f85149" text-anchor="middle">$15.00</text>

  <!-- Opus Cached: $6 → bar height = 120px, bottom at y=380 -->
  <rect x="225" y="260" width="50" height="80" rx="0" fill="#3fb950" fill-opacity="0.5"/>
  <rect x="225" y="340" width="50" height="40" rx="0" fill="#3fb950" fill-opacity="0.3"/>
  <text x="250" y="306" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Cached</text>
  <text x="250" y="253" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">$6.00</text>

  <!-- Savings label -->
  <text x="222" y="405" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Opus</text>
  <text x="222" y="422" font-family="system-ui, sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">-60%</text>

  <!-- ===== SONNET GROUP (center x=420) ===== -->
  <!-- Sonnet Standard: $6 → bar height = 120px -->
  <rect x="370" y="260" width="50" height="60" rx="0" fill="#58a6ff" fill-opacity="0.6"/>
  <rect x="370" y="320" width="50" height="60" rx="0" fill="#58a6ff" fill-opacity="0.3"/>
  <text x="395" y="296" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Input</text>
  <text x="395" y="356" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Output</text>
  <text x="395" y="253" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">$6.00</text>

  <!-- Sonnet Cached: $3 → bar height = 60px -->
  <rect x="425" y="320" width="50" height="30" rx="0" fill="#3fb950" fill-opacity="0.5"/>
  <rect x="425" y="350" width="50" height="30" rx="0" fill="#3fb950" fill-opacity="0.3"/>
  <text x="450" y="342" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Cached</text>
  <text x="450" y="313" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">$3.00</text>

  <!-- Savings label -->
  <text x="422" y="405" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Sonnet</text>
  <text x="422" y="422" font-family="system-ui, sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">-50%</text>

  <!-- ===== HAIKU GROUP (center x=620) ===== -->
  <!-- Haiku Standard: $1.50 → bar height = 30px -->
  <rect x="570" y="350" width="50" height="15" rx="0" fill="#3fb950" fill-opacity="0.6"/>
  <rect x="570" y="365" width="50" height="15" rx="0" fill="#3fb950" fill-opacity="0.3"/>
  <text x="595" y="343" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">$1.50</text>

  <!-- Haiku Cached: $0.80 → bar height = 16px -->
  <rect x="625" y="364" width="50" height="16" rx="0" fill="#3fb950" fill-opacity="0.5"/>
  <text x="650" y="357" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950" text-anchor="middle">$0.80</text>

  <!-- Savings label -->
  <text x="622" y="405" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Haiku</text>
  <text x="622" y="422" font-family="system-ui, sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">-47%</text>

  <!-- ===== Legend ===== -->
  <rect x="250" y="455" width="14" height="14" rx="2" fill="#8b949e" fill-opacity="0.5"/>
  <text x="272" y="467" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Standard</text>

  <rect x="370" y="455" width="14" height="14" rx="2" fill="#3fb950" fill-opacity="0.5"/>
  <text x="392" y="467" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">With Caching</text>

  <text x="540" y="467" font-family="system-ui, sans-serif" font-size="11" fill="#484f58">Darker = Input | Lighter = Output</text>
</svg>
