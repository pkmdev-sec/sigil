<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
  <!-- Background: PITCH BLACK -->
  <rect width="900" height="500" fill="#000000"/>

  <!-- Title -->
  <text x="450" y="35" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Context Window Token Budget</text>

  <!-- Model Selector Tabs -->
  <rect x="240" y="55" width="140" height="32" rx="6" fill="#bc8cff" fill-opacity="0.15" stroke="#bc8cff" stroke-width="1"/>
  <text x="310" y="76" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#bc8cff" text-anchor="middle">Opus 200K</text>

  <rect x="390" y="55" width="140" height="32" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#8b949e" stroke-width="1"/>
  <text x="460" y="76" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Sonnet 200K</text>

  <rect x="540" y="55" width="140" height="32" rx="6" fill="#ffffff" fill-opacity="0.04" stroke="#8b949e" stroke-width="1"/>
  <text x="610" y="76" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Haiku 200K</text>

  <!-- Bar area: x=80 to x=820 = 740px total representing 200K tokens -->
  <!-- System Prompt: ~15% = 111px → x=80 to x=191 -->
  <rect x="80" y="140" width="111" height="80" rx="0" fill="#58a6ff" fill-opacity="0.25" stroke="#58a6ff" stroke-width="1"/>
  <text x="135" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">System</text>
  <text x="135" y="192" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Prompt</text>
  <text x="135" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#58a6ff" text-anchor="middle">~30K tokens</text>
  <text x="135" y="266" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">15%</text>

  <!-- CLAUDE.md: ~5% = 37px → x=191 to x=228 -->
  <rect x="191" y="140" width="37" height="80" rx="0" fill="#bc8cff" fill-opacity="0.25" stroke="#bc8cff" stroke-width="1"/>
  <text x="209" y="183" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90,209,183)">CLAUDE.md</text>
  <text x="209" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#bc8cff" text-anchor="middle">10K</text>
  <text x="209" y="266" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">5%</text>

  <!-- Template: ~10% = 74px → x=228 to x=302 -->
  <rect x="228" y="140" width="74" height="80" rx="0" fill="#3fb950" fill-opacity="0.25" stroke="#3fb950" stroke-width="1"/>
  <text x="265" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Template</text>
  <text x="265" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">20K</text>
  <text x="265" y="266" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">10%</text>

  <!-- Conversation: ~50% = 370px → x=302 to x=672 -->
  <rect x="302" y="140" width="370" height="80" rx="0" fill="#8b949e" fill-opacity="0.15" stroke="#8b949e" stroke-width="1"/>
  <text x="487" y="178" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Conversation History</text>
  <text x="487" y="198" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Messages + Tool Results</text>
  <text x="487" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">~100K tokens</text>
  <text x="487" y="266" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">50%</text>

  <!-- Safety Buffer: ~20% = 148px → x=672 to x=820 -->
  <rect x="672" y="140" width="148" height="80" rx="0" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="746" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f85149" text-anchor="middle">Safety</text>
  <text x="746" y="193" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f85149" text-anchor="middle">Buffer</text>
  <text x="746" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#f85149" text-anchor="middle">~40K tokens</text>
  <text x="746" y="266" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">20%</text>

  <!-- Compaction threshold line at 80% -->
  <line x1="672" y1="120" x2="672" y2="240" stroke="#f85149" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="632" y="105" width="80" height="20" rx="4" fill="#f85149" fill-opacity="0.15" stroke="#f85149" stroke-width="1"/>
  <text x="672" y="119" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#f85149" text-anchor="middle">80% LIMIT</text>

  <!-- Compaction warning arrow -->
  <text x="672" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#f85149" text-anchor="middle">Compaction triggers here</text>

  <!-- Token scale bar -->
  <line x1="80" y1="330" x2="820" y2="330" stroke="#8b949e" stroke-width="1" opacity="0.3"/>
  <text x="80" y="350" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">0K</text>
  <text x="265" y="350" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">50K</text>
  <text x="450" y="350" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">100K</text>
  <text x="635" y="350" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">150K</text>
  <text x="820" y="350" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">200K</text>

  <!-- Tick marks -->
  <line x1="80" y1="325" x2="80" y2="335" stroke="#8b949e" stroke-width="1" opacity="0.5"/>
  <line x1="265" y1="325" x2="265" y2="335" stroke="#8b949e" stroke-width="1" opacity="0.5"/>
  <line x1="450" y1="325" x2="450" y2="335" stroke="#8b949e" stroke-width="1" opacity="0.5"/>
  <line x1="635" y1="325" x2="635" y2="335" stroke="#8b949e" stroke-width="1" opacity="0.5"/>
  <line x1="820" y1="325" x2="820" y2="335" stroke="#8b949e" stroke-width="1" opacity="0.5"/>

  <!-- Key insight box -->
  <rect x="180" y="385" width="540" height="80" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#8b949e" stroke-width="1"/>
  <text x="450" y="415" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Sigil Optimization Target</text>
  <text x="450" y="440" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">System Prompt + CLAUDE.md + Template = ~60K cacheable tokens</text>
  <text x="450" y="458" font-family="system-ui, sans-serif" font-size="12" fill="#3fb950" text-anchor="middle">Cache these sections to save 90% on input costs</text>
</svg>
