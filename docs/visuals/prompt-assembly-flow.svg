<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200">
  <defs>
    <marker id="pa-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Background: PITCH BLACK -->
  <rect width="800" height="1200" fill="#000000"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">System Prompt Assembly</text>
  <text x="400" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">10-Section Pipeline — Order Matters</text>

  <!-- === Section 1: Core Identity (static, blue) === -->
  <rect x="150" y="85" width="440" height="78" rx="8" fill="#58a6ff" fill-opacity="0.06" stroke="#58a6ff" stroke-width="1"/>
  <text x="178" y="115" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#58a6ff">1</text>
  <text x="210" y="115" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Core Identity</text>
  <text x="210" y="138" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">You are Claude Code, an AI assistant by Anthropic...</text>
  <rect x="555" y="98" width="22" height="16" rx="3" fill="#58a6ff" fill-opacity="0.2"/>
  <text x="566" y="110" font-family="system-ui, sans-serif" font-size="9" fill="#58a6ff" text-anchor="middle">S</text>

  <!-- Arrow 1→2 -->
  <line x1="370" y1="163" x2="370" y2="183" stroke="#8b949e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <!-- === Section 2: System Instructions (static, blue) === -->
  <rect x="150" y="185" width="440" height="78" rx="8" fill="#58a6ff" fill-opacity="0.06" stroke="#58a6ff" stroke-width="1"/>
  <text x="178" y="215" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#58a6ff">2</text>
  <text x="210" y="215" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">System Instructions</text>
  <text x="210" y="238" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Behavioral rules, safety guidelines, tool usage</text>
  <rect x="555" y="198" width="22" height="16" rx="3" fill="#58a6ff" fill-opacity="0.2"/>
  <text x="566" y="210" font-family="system-ui, sans-serif" font-size="9" fill="#58a6ff" text-anchor="middle">S</text>

  <!-- Arrow 2→3 -->
  <line x1="370" y1="263" x2="370" y2="283" stroke="#8b949e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <!-- === Section 3: Tool Definitions (static, blue) === -->
  <rect x="150" y="285" width="440" height="78" rx="8" fill="#58a6ff" fill-opacity="0.06" stroke="#58a6ff" stroke-width="1"/>
  <text x="178" y="315" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#58a6ff">3</text>
  <text x="210" y="315" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Tool Definitions</text>
  <text x="210" y="338" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">JSON schemas for Read, Edit, Bash, Glob, Grep...</text>
  <rect x="555" y="298" width="22" height="16" rx="3" fill="#58a6ff" fill-opacity="0.2"/>
  <text x="566" y="310" font-family="system-ui, sans-serif" font-size="9" fill="#58a6ff" text-anchor="middle">S</text>

  <!-- Arrow 3→4 -->
  <line x1="370" y1="363" x2="370" y2="383" stroke="#8b949e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <!-- === Section 4: Permission Mode (dynamic, green) === -->
  <rect x="150" y="385" width="440" height="78" rx="8" fill="#3fb950" fill-opacity="0.06" stroke="#3fb950" stroke-width="1"/>
  <text x="178" y="415" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#3fb950">4</text>
  <text x="210" y="415" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Permission Mode</text>
  <text x="210" y="438" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">plan / default / acceptEdits / bypassPermissions</text>
  <rect x="555" y="398" width="22" height="16" rx="3" fill="#3fb950" fill-opacity="0.2"/>
  <text x="566" y="410" font-family="system-ui, sans-serif" font-size="9" fill="#3fb950" text-anchor="middle">D</text>

  <!-- Arrow 4→5 -->
  <line x1="370" y1="463" x2="370" y2="483" stroke="#8b949e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <!-- === Section 5: CLAUDE.md Content (user, purple) === -->
  <rect x="150" y="485" width="440" height="78" rx="8" fill="#bc8cff" fill-opacity="0.06" stroke="#bc8cff" stroke-width="1"/>
  <text x="178" y="515" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#bc8cff">5</text>
  <text x="210" y="515" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">CLAUDE.md Content</text>
  <text x="210" y="538" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Global + project-level user instructions</text>
  <rect x="555" y="498" width="22" height="16" rx="3" fill="#bc8cff" fill-opacity="0.2"/>
  <text x="566" y="510" font-family="system-ui, sans-serif" font-size="9" fill="#bc8cff" text-anchor="middle">U</text>

  <!-- Arrow 5→6 -->
  <line x1="370" y1="563" x2="370" y2="583" stroke="#8b949e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <!-- === Section 6: Environment Metadata (dynamic, green) === -->
  <rect x="150" y="585" width="440" height="78" rx="8" fill="#3fb950" fill-opacity="0.06" stroke="#3fb950" stroke-width="1"/>
  <text x="178" y="615" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#3fb950">6</text>
  <text x="210" y="615" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Environment Metadata</text>
  <text x="210" y="638" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">cwd, git status, OS, shell, date, model info</text>
  <rect x="555" y="598" width="22" height="16" rx="3" fill="#3fb950" fill-opacity="0.2"/>
  <text x="566" y="610" font-family="system-ui, sans-serif" font-size="9" fill="#3fb950" text-anchor="middle">D</text>

  <!-- Arrow 6→7 -->
  <line x1="370" y1="663" x2="370" y2="683" stroke="#8b949e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <!-- === Section 7: Output Style (user, purple) === -->
  <rect x="150" y="685" width="440" height="78" rx="8" fill="#bc8cff" fill-opacity="0.06" stroke="#bc8cff" stroke-width="1"/>
  <text x="178" y="715" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#bc8cff">7</text>
  <text x="210" y="715" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Output Style</text>
  <text x="210" y="738" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Formatting instructions, markdown, conciseness</text>
  <rect x="555" y="698" width="22" height="16" rx="3" fill="#bc8cff" fill-opacity="0.2"/>
  <text x="566" y="710" font-family="system-ui, sans-serif" font-size="9" fill="#bc8cff" text-anchor="middle">U</text>

  <!-- Arrow 7→8 -->
  <line x1="370" y1="763" x2="370" y2="783" stroke="#8b949e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <!-- === Section 8: System Reminders (dynamic, green) === -->
  <rect x="150" y="785" width="440" height="78" rx="8" fill="#3fb950" fill-opacity="0.06" stroke="#3fb950" stroke-width="1"/>
  <text x="178" y="815" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#3fb950">8</text>
  <text x="210" y="815" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">System Reminders</text>
  <text x="210" y="838" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Runtime injections: budget, skills, context</text>
  <rect x="555" y="798" width="22" height="16" rx="3" fill="#3fb950" fill-opacity="0.2"/>
  <text x="566" y="810" font-family="system-ui, sans-serif" font-size="9" fill="#3fb950" text-anchor="middle">D</text>

  <!-- Arrow 8→9 -->
  <line x1="370" y1="863" x2="370" y2="883" stroke="#8b949e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <!-- === Section 9: Few-Shot Examples (static, blue) === -->
  <rect x="150" y="885" width="440" height="78" rx="8" fill="#58a6ff" fill-opacity="0.06" stroke="#58a6ff" stroke-width="1"/>
  <text x="178" y="915" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#58a6ff">9</text>
  <text x="210" y="915" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Few-Shot Examples</text>
  <text x="210" y="938" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Behavior demonstrations for tool usage patterns</text>
  <rect x="555" y="898" width="22" height="16" rx="3" fill="#58a6ff" fill-opacity="0.2"/>
  <text x="566" y="910" font-family="system-ui, sans-serif" font-size="9" fill="#58a6ff" text-anchor="middle">S</text>

  <!-- Arrow 9→10 -->
  <line x1="370" y1="963" x2="370" y2="983" stroke="#8b949e" stroke-width="1.5" marker-end="url(#pa-arrow)"/>

  <!-- === Section 10: Anti-Pattern Rules (static, blue) === -->
  <rect x="150" y="985" width="440" height="78" rx="8" fill="#58a6ff" fill-opacity="0.06" stroke="#58a6ff" stroke-width="1"/>
  <text x="170" y="1015" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#58a6ff">10</text>
  <text x="210" y="1015" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Anti-Pattern Rules</text>
  <text x="210" y="1038" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">NEVER, MUST, DO NOT — hard behavioral constraints</text>
  <rect x="555" y="998" width="22" height="16" rx="3" fill="#58a6ff" fill-opacity="0.2"/>
  <text x="566" y="1010" font-family="system-ui, sans-serif" font-size="9" fill="#58a6ff" text-anchor="middle">S</text>

  <!-- ===== RIGHT SIDE BRACKETS ===== -->
  <!-- Cacheable Prefix bracket (sections 1-3): y=85 to y=363 -->
  <line x1="620" y1="95" x2="640" y2="95" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="640" y1="95" x2="640" y2="353" stroke="#3fb950" stroke-width="1.5"/>
  <line x1="620" y1="353" x2="640" y2="353" stroke="#3fb950" stroke-width="1.5"/>
  <text x="655" y="210" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#3fb950" transform="rotate(90,655,210)">Cacheable Prefix</text>

  <!-- Variable bracket (sections 4-10): y=385 to y=1063 -->
  <line x1="620" y1="395" x2="640" y2="395" stroke="#d29922" stroke-width="1.5"/>
  <line x1="640" y1="395" x2="640" y2="1053" stroke="#d29922" stroke-width="1.5"/>
  <line x1="620" y1="1053" x2="640" y2="1053" stroke="#d29922" stroke-width="1.5"/>
  <text x="655" y="724" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#d29922" transform="rotate(90,655,724)">Variable Suffix</text>

  <!-- ===== Legend ===== -->
  <rect x="150" y="1110" width="12" height="12" rx="2" fill="#58a6ff" fill-opacity="0.3" stroke="#58a6ff" stroke-width="1"/>
  <text x="170" y="1121" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">S = Static</text>

  <rect x="290" y="1110" width="12" height="12" rx="2" fill="#3fb950" fill-opacity="0.3" stroke="#3fb950" stroke-width="1"/>
  <text x="310" y="1121" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">D = Dynamic</text>

  <rect x="430" y="1110" width="12" height="12" rx="2" fill="#bc8cff" fill-opacity="0.3" stroke="#bc8cff" stroke-width="1"/>
  <text x="450" y="1121" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">U = User-defined</text>
</svg>
