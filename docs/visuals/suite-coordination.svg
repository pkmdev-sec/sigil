<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <marker id="sc-ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#58a6ff"/>
    </marker>
    <marker id="sc-ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#3fb950"/>
    </marker>
    <marker id="sc-ao" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#d29922"/>
    </marker>
    <marker id="sc-ay" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#e3b341"/>
    </marker>
    <marker id="sc-ap" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#bc8cff"/>
    </marker>
  </defs>

  <!-- Background: PITCH BLACK -->
  <rect width="1000" height="700" fill="#000000"/>

  <!-- Title -->
  <text x="500" y="40" font-family="system-ui, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Feature Build Suite</text>
  <text x="500" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Multi-Agent Coordination Pattern</text>

  <!-- ===== CENTRAL COORDINATOR ===== -->
  <rect x="375" y="290" width="250" height="90" rx="12" fill="#bc8cff" fill-opacity="0.1" stroke="#bc8cff" stroke-width="2"/>
  <text x="500" y="328" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Coordinator</text>
  <text x="500" y="352" font-family="system-ui, sans-serif" font-size="13" fill="#bc8cff" text-anchor="middle">opus — orchestrates all agents</text>

  <!-- ===== RESEARCHER (top-left, blue) ===== -->
  <rect x="60" y="120" width="220" height="110" rx="8" fill="#58a6ff" fill-opacity="0.06" stroke="#58a6ff" stroke-width="1"/>
  <text x="170" y="152" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Researcher</text>
  <text x="170" y="175" font-family="system-ui, sans-serif" font-size="13" fill="#58a6ff" text-anchor="middle">haiku</text>
  <text x="170" y="198" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Read, Grep, Glob, WebSearch</text>
  <text x="170" y="216" font-family="system-ui, sans-serif" font-size="10" fill="#484f58" text-anchor="middle">Explore codebase &amp; gather context</text>

  <!-- Bidirectional: Researcher ↔ Coordinator -->
  <line x1="265" y1="210" x2="395" y2="300" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#sc-ap)"/>
  <line x1="385" y1="295" x2="275" y2="218" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#sc-ab)"/>
  <text x="290" y="260" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff" transform="rotate(-25,290,260)">findings</text>
  <text x="350" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#bc8cff" transform="rotate(-25,350,270)">queries</text>

  <!-- ===== IMPLEMENTER (top-right, green) ===== -->
  <rect x="720" y="120" width="220" height="110" rx="8" fill="#3fb950" fill-opacity="0.06" stroke="#3fb950" stroke-width="1"/>
  <text x="830" y="152" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Implementer</text>
  <text x="830" y="175" font-family="system-ui, sans-serif" font-size="13" fill="#3fb950" text-anchor="middle">opus</text>
  <text x="830" y="198" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Read, Edit, Write, Bash</text>
  <text x="830" y="216" font-family="system-ui, sans-serif" font-size="10" fill="#484f58" text-anchor="middle">Write code &amp; apply changes</text>

  <!-- Bidirectional: Implementer ↔ Coordinator -->
  <line x1="735" y1="210" x2="610" y2="300" stroke="#3fb950" stroke-width="1.5" marker-end="url(#sc-ap)"/>
  <line x1="615" y1="295" x2="725" y2="218" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#sc-ag)"/>
  <text x="700" y="260" font-family="system-ui, sans-serif" font-size="10" fill="#3fb950" transform="rotate(25,700,260)">diffs</text>
  <text x="640" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#bc8cff" transform="rotate(25,640,270)">tasks</text>

  <!-- ===== REVIEWER (bottom-left, orange) ===== -->
  <rect x="60" y="480" width="220" height="110" rx="8" fill="#d29922" fill-opacity="0.06" stroke="#d29922" stroke-width="1"/>
  <text x="170" y="512" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Reviewer</text>
  <text x="170" y="535" font-family="system-ui, sans-serif" font-size="13" fill="#d29922" text-anchor="middle">sonnet</text>
  <text x="170" y="558" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Read, Grep, Glob</text>
  <text x="170" y="576" font-family="system-ui, sans-serif" font-size="10" fill="#484f58" text-anchor="middle">Review code &amp; suggest fixes</text>

  <!-- Bidirectional: Reviewer ↔ Coordinator -->
  <line x1="265" y1="500" x2="395" y2="375" stroke="#d29922" stroke-width="1.5" marker-end="url(#sc-ap)"/>
  <line x1="385" y1="380" x2="275" y2="492" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#sc-ao)"/>
  <text x="290" y="448" font-family="system-ui, sans-serif" font-size="10" fill="#d29922" transform="rotate(25,290,448)">feedback</text>
  <text x="350" y="438" font-family="system-ui, sans-serif" font-size="10" fill="#bc8cff" transform="rotate(25,350,438)">review reqs</text>

  <!-- ===== TESTER (bottom-right, yellow) ===== -->
  <rect x="720" y="480" width="220" height="110" rx="8" fill="#e3b341" fill-opacity="0.06" stroke="#e3b341" stroke-width="1"/>
  <text x="830" y="512" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Tester</text>
  <text x="830" y="535" font-family="system-ui, sans-serif" font-size="13" fill="#e3b341" text-anchor="middle">sonnet</text>
  <text x="830" y="558" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Read, Bash, Grep</text>
  <text x="830" y="576" font-family="system-ui, sans-serif" font-size="10" fill="#484f58" text-anchor="middle">Run tests &amp; validate output</text>

  <!-- Bidirectional: Tester ↔ Coordinator -->
  <line x1="735" y1="500" x2="610" y2="375" stroke="#e3b341" stroke-width="1.5" marker-end="url(#sc-ap)"/>
  <line x1="615" y1="380" x2="725" y2="492" stroke="#bc8cff" stroke-width="1.5" marker-end="url(#sc-ay)"/>
  <text x="700" y="448" font-family="system-ui, sans-serif" font-size="10" fill="#e3b341" transform="rotate(-25,700,448)">results</text>
  <text x="640" y="438" font-family="system-ui, sans-serif" font-size="10" fill="#bc8cff" transform="rotate(-25,640,438)">test reqs</text>

  <!-- ===== Legend ===== -->
  <line x1="300" y1="660" x2="340" y2="660" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="350" y="664" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Coordination</text>
  <line x1="480" y1="660" x2="520" y2="660" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="530" y="664" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Message Passing</text>
</svg>
